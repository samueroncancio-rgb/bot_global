risk:
  execution_mode: "paper"   # replay | paper | testnet | live
  margin_type: "ISOLATED"   # ISOLATED obligatorio
  position_mode: "ONE_WAY"  # ONE_WAY obligatorio
  default_leverage: 3       # Apalancamiento conservador por defecto
  max_leverage: 5

  limits:
    max_order_notional_usd: 2000.0
    max_position_notional_usd: 10000.0
    max_daily_drawdown_pct: 0.03     # 3% del balance inicial del día
    max_trade_loss_pct: 0.01         # 1% de stop loss por operación
    fat_finger_price_deviation_pct: 0.02 # Rechaza órdenes a más del 2% del mark price

  latency:
    baseline_ping_samples: 10
    max_acceptable_rtt_ms: 600.0
    rtt_spike_multiplier: 3.0

  kill_switch:
    max_data_staleness_ms: 1000
    max_book_desync_ms: 300
    max_consecutive_order_rejections: 3
    stop_loss_attach_timeout_ms: 1500
    emergency_order_type: "MARKET"
    emergency_reduce_only: true

